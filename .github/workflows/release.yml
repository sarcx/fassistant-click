name: Release

# Tag a commit to cut a release:
#   git tag v0.1.0 && git push origin v0.1.0
#
# The tag has to match VERSION_NAME in gradle.properties, which stays the single source of truth.
# Older releases are deleted afterwards, so only the newest one is ever published.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  BUILD_TOOLS: 36.1.0

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Install the SDK pieces this build needs
        run: sdkmanager --install "platforms;android-36" "build-tools;${BUILD_TOOLS}"

      - name: Read the version, and check the tag agrees with it
        id: version
        run: |
          NAME=$(sed -n 's/^VERSION_NAME=//p' gradle.properties)
          CODE=$(sed -n 's/^VERSION_CODE=//p' gradle.properties)
          if [ -z "$NAME" ] || [ -z "$CODE" ]; then
            echo "::error::VERSION_NAME or VERSION_CODE is missing from gradle.properties"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match VERSION_NAME $NAME — bump one of them"
            exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=v$NAME" >> "$GITHUB_OUTPUT"

      - name: Refuse to republish a version that is already out
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already released — bump VERSION_NAME and VERSION_CODE"
            exit 1
          fi

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the KEYSTORE_BASE64 secret is not set, and a build signed with any other key cannot update an installed copy"
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"

      - name: Build
        env:
          FCLICK_KEYSTORE: ${{ runner.temp }}/signing.jks
          FCLICK_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          FCLICK_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          FCLICK_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          # Baked into the APK so an installed copy knows where to find its successor. The
          # "latest" path always resolves to the newest release, so this address never changes.
          FCLICK_UPDATE_URL: https://github.com/${{ github.repository }}/releases/latest/download/update.json
        run: ./gradlew --no-daemon :app:dist

      - name: Show what signed the APK
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner"
          CERTS=$("$APKSIGNER" verify --print-certs dist/fassistant-click.apk)
          echo "$CERTS"
          if ! echo "$CERTS" | grep -q "SHA-256 digest"; then
            echo "::error::the APK carries no signature"
            exit 1
          fi

      - name: Delete the key
        if: always()
        run: rm -f "$RUNNER_TEMP/signing.jks"

      - name: Take the notes from the changelog
        # Everything between the first "## " heading and the next one.
        run: awk '/^## /{seen++; next} seen==1' CHANGELOG.md > "$RUNNER_TEMP/notes.md"

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/fassistant-click.apk \
            dist/update.json

      - name: Keep only this release
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: ${{ steps.version.outputs.tag }}
        run: |
          # The tags stay: only the published releases and their assets are removed, so nothing
          # in the history is lost. Add --cleanup-tag below to drop the tags as well.
          gh release list --limit 100 --json tagName --jq '.[].tagName' > all-tags.txt
          while read -r old; do
            [ -n "$old" ] || continue
            [ "$old" = "$KEEP" ] && continue
            echo "deleting release $old"
            gh release delete "$old" --yes
          done < all-tags.txt

      - name: Summary
        run: |
          {
            echo "### ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})"
            echo
            echo '```json'
            cat dist/update.json
            echo '```'
            echo
            echo "Installed copies check:"
            echo "\`https://github.com/${{ github.repository }}/releases/latest/download/update.json\`"
          } >> "$GITHUB_STEP_SUMMARY"
